# SPA + API 反代
# /api 原样透传（不带 URI 后缀）：后端 context-path 已含 /api/ragent，
# proxy_pass http://backend:9090 会把完整路径 /api/ragent/... 送给后端
server {
    listen 80;
    server_name _;

    # 知识库文档上传（MinerU 解析的大 PDF 也够用）
    client_max_body_size 100m;

    location /api/ {
        proxy_pass http://backend:9090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式问答：关缓冲、拉长读超时（对齐后端 sse-timeout-ms 5min 上限再放余量）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 前端路由交回 index.html（深链刷新不 404）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
